apiVersion: apps/v1
kind: Deployment
metadata:
  name: volunteer-service
  namespace: solidarytech-prod
  labels:
    app: volunteer-service
    version: "1.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: volunteer-service
  template:
    metadata:
      labels:
        app: volunteer-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: volunteer-service
        image: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/solidarytech-volunteer-service:latest
        ports:
        - containerPort: 8083
        env:
        - name: PORT
          value: "8083"
        - name: AWS_DYNAMODB_TABLE
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DYNAMODB_TABLE
        envFrom:
        - configMapRef:
            name: app-config
        resources:
          requests:
            cpu: "50m"
            memory: "96Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8083
          initialDelaySeconds: 20
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8083
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: volunteer-service
  namespace: solidarytech-prod
spec:
  selector:
    app: volunteer-service
  ports:
  - port: 8083
    targetPort: 8083
