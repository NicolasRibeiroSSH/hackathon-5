name: ngo-service CI/CD

on:
  push:
    branches: [main]
    paths: [ngo-service/**]
  pull_request:
    branches: [main]
    paths: [ngo-service/**]

env:
  SERVICE: ngo-service
  ECR_REPO: solidarytech-ngo-service
  AWS_REGION: us-east-1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install & test
        working-directory: ngo-service
        run: |
          pip install -r requirements.txt pytest
          pytest --tb=short || true

  security-scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Trivy — filesystem SAST/SCA
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ./ngo-service
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: sarif
          output: trivy-results.sarif
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  build-push:
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-ecr
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build & scan image
        working-directory: ngo-service
        run: |
          IMAGE=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO }}
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
      - name: Trivy — scan image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
      - name: Push to ECR
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest
      - name: Update GitOps values
        run: |
          sed -i "s|tag:.*|tag: \"${{ github.sha }}\"|" helm-charts/ngo-service/values.yaml
          git config user.email "ci@solidarytech.org"
          git config user.name "CI Bot"
          git add helm-charts/ngo-service/values.yaml
          git commit -m "chore: update ngo-service image to ${{ github.sha }}" || true
          git push || true
