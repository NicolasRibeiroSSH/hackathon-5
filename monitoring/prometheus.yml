global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yaml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: ngo-service
    static_configs:
      - targets: [ngo-service:8081]
    metrics_path: /metrics

  - job_name: donation-service
    static_configs:
      - targets: [donation-service:8082]
    metrics_path: /metrics

  - job_name: volunteer-service
    static_configs:
      - targets: [volunteer-service:8083]
    metrics_path: /metrics

  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8889]
