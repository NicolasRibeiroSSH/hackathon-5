replicaCount: 1

image:
  repository: 964177143569.dkr.ecr.us-east-1.amazonaws.com/solidarytech-volunteer-service
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ecr-secret

service:
  type: ClusterIP
  port: 8083

env:
  - name: PORT
    value: "8083"
  - name: AWS_DYNAMODB_TABLE
    valueFrom:
      secretKeyRef:
        name: app-secrets
        key: DYNAMODB_TABLE
  - name: AWS_REGION
    valueFrom:
      secretKeyRef:
        name: app-secrets
        key: AWS_REGION
  - name: OTEL_SERVICE_NAME
    value: "volunteer-service"
  - name: OTEL_SERVICE_VERSION
    value: "1.0.0"
  - name: OTEL_ENV
    value: "prod"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "otel-collector.monitoring:4317"

resources:
  requests:
    cpu: "50m"
    memory: "96Mi"
  limits:
    cpu: "200m"
    memory: "256Mi"

livenessProbe:
  httpGet:
    path: /health
    port: 8083
  initialDelaySeconds: 20
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /health
    port: 8083
  initialDelaySeconds: 10
  periodSeconds: 10
