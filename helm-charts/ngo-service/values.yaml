replicaCount: 1

image:
  repository: 964177143569.dkr.ecr.us-east-1.amazonaws.com/solidarytech-ngo-service
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ecr-secret

service:
  type: ClusterIP
  port: 8081

env:
  - name: PORT
    value: "8081"
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: app-secrets
        key: NGO_DATABASE_URL
  - name: OTEL_SERVICE_NAME
    value: "ngo-service"
  - name: OTEL_SERVICE_VERSION
    value: "1.0.0"
  - name: OTEL_ENV
    value: "prod"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "otel-collector-opentelemetry-collector.monitoring:4317"
  - name: OTEL_EXPORTER_OTLP_PROTOCOL
    value: "grpc"

resources:
  requests:
    cpu: "50m"
    memory: "96Mi"
  limits:
    cpu: "200m"
    memory: "256Mi"

livenessProbe:
  httpGet:
    path: /health
    port: 8081
  initialDelaySeconds: 20
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /health
    port: 8081
  initialDelaySeconds: 10
  periodSeconds: 10
